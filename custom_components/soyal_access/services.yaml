clear_fifo_pause:
  name: Clear FIFO protocol pause
  description: Clear the FIFO pause after checking the cause and isolating other clients. Automatic sync must remain off. Pending removal records are preserved.
  fields:
    entry_id:
      name: SOYAL config entry ID
      required: true
      selector:
        text:
    verified:
      name: Verified that the protocol issue was addressed
      required: true
      selector:
        boolean:
